<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PharmaCopilot</title>
<style>
  :root {
    --bg:            #eef1ec;
    --panel:         #f7f8f5;
    --ink:           #1c2320;
    --ink-soft:      #565f5a;
    --line:          #d7dcd4;
    --accent:        #3a6b5c;
    --accent-ink:    #ffffff;
    --flag-stockout: #b0563a;
    --flag-expiry:   #b3901f;
    --flag-dead:     #6c7570;
    --flag-ghost:    #6f6a95;
    --flag-spike:    #2d7d46;
    --flag-drop:     #8b3a1a;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }

  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  /* ── Topbar ── */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center;
    height: 3rem; padding: 0 1rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    gap: .75rem;
  }
  .wordmark { font-weight: 700; font-size: 1rem; letter-spacing: .01em; white-space: nowrap; }
  .wordmark span { color: var(--accent); }

  /* Nav tabs */
  .nav { display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
  .nav-btn {
    font-family: var(--sans); font-size: .8rem; font-weight: 600;
    border: none; background: none; border-radius: 4px;
    padding: .25rem .75rem; cursor: pointer;
    color: var(--ink-soft); white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .nav-btn.active { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
  select {
    font-family: var(--sans); font-size: .82rem;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 5px;
    padding: .3rem .5rem; cursor: pointer; max-width: 44vw;
  }
  .date-badge { font-size: .76rem; color: var(--ink-soft); white-space: nowrap; }

  /* ── Views ── */
  .view { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* ── Dashboard — 6 flag cards ── */
  .flag-grid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .45rem;
    padding: .55rem 1rem;
    border-bottom: 1px solid var(--line);
  }

  .flag-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left-width: 3px;
    border-radius: 7px;
    padding: .5rem .65rem;
    cursor: pointer;
    display: flex; align-items: center; gap: .5rem;
    user-select: none;
    transition: opacity .12s;
  }
  .flag-card:hover        { opacity: .82; }
  .flag-card:focus-visible{ outline: 2px solid var(--accent); }
  .flag-card.active       { box-shadow: 0 0 0 2px currentColor; }

  .flag-card.stockout { border-left-color: var(--flag-stockout); color: var(--flag-stockout); }
  .flag-card.expiry   { border-left-color: var(--flag-expiry);   color: var(--flag-expiry); }
  .flag-card.dead     { border-left-color: var(--flag-dead);     color: var(--flag-dead); }
  .flag-card.ghost    { border-left-color: var(--flag-ghost);    color: var(--flag-ghost); }
  .flag-card.spike    { border-left-color: var(--flag-spike);    color: var(--flag-spike); }
  .flag-card.drop     { border-left-color: var(--flag-drop);     color: var(--flag-drop); }

  .card-count { font-size: 2rem; font-weight: 700; font-family: var(--mono); line-height: 1; min-width: 2ch; }
  .card-meta  {
    flex: 1; min-width: 0;
    display: flex; align-items: center;
    justify-content: space-between;
    gap: .75rem;
  }
  .card-label { font-size: .9rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink); white-space: nowrap; }
  .card-sub   { font-size: .75rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

  /* ── Detail panel ── */
  .detail-panel {
    flex: 0 0 auto; max-height: 185px; overflow-y: auto;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .detail-panel[hidden] { display: none; }
  .detail-header {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel);
    display: flex; justify-content: space-between; align-items: center;
    padding: .35rem 1rem; border-bottom: 1px solid var(--line);
  }
  .detail-title { font-size: .8rem; font-weight: 600; color: var(--ink); }
  .detail-close { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 1.1rem; line-height: 1; padding: 0 .25rem; }
  .detail-list  { padding: .25rem 1rem .5rem; }
  .detail-row   {
    display: grid; grid-template-columns: 1fr auto;
    column-gap: .5rem; padding: .3rem 0;
    border-bottom: 1px dashed var(--line); font-size: .8rem;
  }
  .detail-row:last-child  { border-bottom: none; }
  .detail-name   { font-weight: 500; color: var(--ink); }
  .detail-store  { font-size: .7rem; color: var(--ink-soft); }
  .detail-action { font-size: .7rem; color: var(--accent); grid-column: 1 / -1; margin-top: .1rem; }
  .detail-meta   { font-family: var(--mono); font-size: .74rem; color: var(--ink-soft); text-align: right; white-space: pre; }

  /* ── Chat view ── */
  .chat-log {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: .8rem 1rem;
    display: flex; flex-direction: column; gap: .55rem;
  }
  .chat-empty { margin: auto; color: var(--ink-soft); font-size: .88rem; text-align: center; max-width: 28ch; }
  .chat-hint  { font-size: .74rem; margin-top: .35rem; color: var(--line); }

  .msg { max-width: 76%; padding: .5rem .7rem; border-radius: 9px; font-size: .88rem; white-space: pre-wrap; word-break: break-word; }
  .msg.user      { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; color: var(--ink); }
  .msg.assistant.pending  { color: var(--ink-soft); font-style: italic; }
  .msg.assistant.is-error { color: var(--flag-stockout); }

  .evidence { margin-top: .45rem; border-top: 1px dashed var(--line); padding-top: .35rem; }
  .evidence summary { cursor: pointer; font-size: .74rem; color: var(--accent); list-style: none; }
  .evidence summary::before { content: "▶ "; }
  details[open] > .evidence > summary::before { content: "▼ "; }
  .evidence-body { margin-top: .35rem; font-family: var(--mono); font-size: .72rem; color: var(--ink-soft); white-space: pre-wrap; max-height: 150px; overflow-y: auto; }

  .chat-input-row {
    flex: 0 0 auto; display: flex; gap: .5rem;
    padding: .55rem 1rem;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  #chatInput {
    flex: 1; min-width: 0; font-family: var(--sans); font-size: .88rem;
    padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  #chatInput:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .send-btn {
    font-family: var(--sans); font-size: .85rem; font-weight: 600;
    color: var(--accent-ink); background: var(--accent);
    border: none; border-radius: 6px; padding: 0 1rem; cursor: pointer;
  }
  .send-btn:disabled { opacity: .5; cursor: default; }

  @media (max-width: 440px) {
    .flag-grid  { gap: .3rem; padding: .4rem .65rem; }
    .card-count { font-size: 1.5rem; }
    .card-label { font-size: .78rem; }
    .msg        { max-width: 92%; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="wordmark">Pharma<span>Copilot</span></div>
    <nav class="nav">
      <button class="nav-btn active" id="btn-dashboard" onclick="switchView('dashboard')">Dashboard</button>
      <button class="nav-btn"        id="btn-chat"      onclick="switchView('chat')">Ask Copilot</button>
    </nav>
    <div class="topbar-right">
      <select id="storeSelect" aria-label="Select store">
        <option value="all">All Stores</option>
        <!-- filled from GET /api/data/stores -->
      </select>
      <span class="date-badge" id="todayDate"></span>
    </div>
  </header>

  <!-- ── Dashboard view ── -->
  <div id="view-dashboard" class="view active">

    <!-- 6 flag cards -->
    <section class="flag-grid" aria-label="Today's attention">

      <div class="flag-card stockout" id="card-stockout" role="button" tabindex="0">
        <div class="card-count" id="count-stockout">—</div>
        <div class="card-meta">
          <div class="card-label">Stockout Risk</div>
          <div class="card-sub"   id="sub-stockout">Loading…</div>
        </div>
      </div>

      <div class="flag-card expiry" id="card-expiry" role="button" tabindex="0">
        <div class="card-count" id="count-expiry">—</div>
        <div class="card-meta">
          <div class="card-label">Near Expiry</div>
          <div class="card-sub"  id="sub-expiry">Loading…</div>
        </div>
      </div>

      <div class="flag-card dead" id="card-dead" role="button" tabindex="0">
        <div class="card-count" id="count-dead">—</div>
        <div class="card-meta">
          <div class="card-label">Dead Stock</div>
          <div class="card-sub"  id="sub-dead">Loading…</div>
        </div>
      </div>

      <div class="flag-card ghost" id="card-ghost" role="button" tabindex="0">
        <div class="card-count" id="count-ghost">—</div>
        <div class="card-meta">
          <div class="card-label">Ghost Stock</div>
          <div class="card-sub"  id="sub-ghost">Loading…</div>
        </div>
      </div>

      <div class="flag-card spike" id="card-spike" role="button" tabindex="0">
        <div class="card-count" id="count-spike">—</div>
        <div class="card-meta">
          <div class="card-label">Sales Spike</div>
          <div class="card-sub"  id="sub-spike">Loading…</div>
        </div>
      </div>

      <div class="flag-card drop" id="card-drop" role="button" tabindex="0">
        <div class="card-count" id="count-drop">—</div>
        <div class="card-meta">
          <div class="card-label">Sales Drop</div>
          <div class="card-sub"  id="sub-drop">Loading…</div>
        </div>
      </div>

    </section>

    <!-- Detail panel — shown on card click -->
    <section class="detail-panel" id="detailPanel" hidden aria-live="polite">
      <div class="detail-header">
        <span class="detail-title" id="detailTitle"></span>
        <button class="detail-close" id="detailClose" aria-label="Close">×</button>
      </div>
      <div class="detail-list" id="detailList"></div>
    </section>

  </div><!-- /dashboard -->

  <!-- ── Chat view ── -->
  <div id="view-chat" class="view">
    <div class="chat-log" id="chatLog">
      <div class="chat-empty" id="chatEmpty">
        Ask about sales, stock levels, or today's flags.
        <div class="chat-hint">e.g. "What's running low at the Mall Branch?"</div>
      </div>
    </div>
    <form class="chat-input-row" id="chatForm">
      <input id="chatInput" type="text" placeholder="Ask a question…" autocomplete="off" />
      <button class="send-btn" type="submit" id="chatSend">Send</button>
    </form>
  </div><!-- /chat -->

</div><!-- /app -->

<script>
(function () {
  "use strict";

  /* ── State ── */
  var report        = null;   // cached from GET /api/attention
  var activeCard    = null;   // 'stockout'|'expiry'|'dead'|'ghost'|'spike'|'drop'|null
  var selectedStore = "all";  // 'all'|'S001'|'S002'|'S003'

  /* ── DOM refs ── */
  var storeSelect = document.getElementById("storeSelect");
  var todayDateEl = document.getElementById("todayDate");
  var detailPanel = document.getElementById("detailPanel");
  var detailTitle = document.getElementById("detailTitle");
  var detailList  = document.getElementById("detailList");
  var detailClose = document.getElementById("detailClose");
  var chatLog     = document.getElementById("chatLog");
  var chatEmpty   = document.getElementById("chatEmpty");
  var chatForm    = document.getElementById("chatForm");
  var chatInput   = document.getElementById("chatInput");
  var chatSend    = document.getElementById("chatSend");

  var cards = {
    stockout: { el: document.getElementById("card-stockout"), count: document.getElementById("count-stockout"), sub: document.getElementById("sub-stockout") },
    expiry:   { el: document.getElementById("card-expiry"),   count: document.getElementById("count-expiry"),   sub: document.getElementById("sub-expiry")   },
    dead:     { el: document.getElementById("card-dead"),     count: document.getElementById("count-dead"),     sub: document.getElementById("sub-dead")     },
    ghost:    { el: document.getElementById("card-ghost"),    count: document.getElementById("count-ghost"),    sub: document.getElementById("sub-ghost")    },
    spike:    { el: document.getElementById("card-spike"),    count: document.getElementById("count-spike"),    sub: document.getElementById("sub-spike")    },
    drop:     { el: document.getElementById("card-drop"),     count: document.getElementById("count-drop"),     sub: document.getElementById("sub-drop")     },
  };

  /* ── Date ── */
  todayDateEl.textContent = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  /* ── View switching ── */
  window.switchView = function (view) {
    document.querySelectorAll(".view").forEach(function (el)    { el.classList.remove("active"); });
    document.querySelectorAll(".nav-btn").forEach(function (el) { el.classList.remove("active"); });
    document.getElementById("view-" + view).classList.add("active");
    document.getElementById("btn-"  + view).classList.add("active");
    if (view === "chat") chatInput.focus();
  };

  /* ── Utility ── */
  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* "Paracetamol 500mg and 2 more" */
  function makeSub(items, labelFn) {
    if (!items || !items.length) return "";
    var first = labelFn(items[0]);
    return items.length > 1 ? first + " and " + (items.length - 1) + " more" : first;
  }

  /* ── Load stores from GET /api/data/stores ── */
  async function loadStores() {
    try {
      var res  = await fetch("/api/data/stores");
      var data = await res.json();
      (data.stores || []).forEach(function (s) {
        var opt = document.createElement("option");
        opt.value       = s.store_id;    // S001 / S002 / S003
        opt.textContent = s.store_name;  // MedPlus Downtown etc.
        storeSelect.appendChild(opt);
      });
    } catch (_) { /* keep default "All Stores" */ }
  }

  /* Store change — update counts AND refresh open detail panel (no toggle) */
  storeSelect.addEventListener("change", function () {
    selectedStore = storeSelect.value;
    if (report) renderCards();
    if (activeCard && !detailPanel.hidden) {
      buildDetailList(activeCard);   // refresh contents, do NOT toggle off
    }
  });

  /* ── Load attention from GET /api/attention ── */
  async function loadAttention() {
    Object.values(cards).forEach(function (c) {
      c.count.textContent = "—";
      c.sub.textContent   = "Loading…";
    });
    try {
      var res  = await fetch("/api/attention");
      var data = await res.json();
      if (data.status === "ok") {
        report = data.report;
        renderCards();
      } else {
        setError();
      }
    } catch (_) { setError(); }
  }

  function setError() {
    Object.values(cards).forEach(function (c) {
      c.count.textContent = "!";
      c.sub.textContent   = "Could not load";
    });
  }

  /* Filter by selected store — works for ALL 6 flag types (all have store_id) */
  function filterStore(items) {
    if (selectedStore === "all" || !items) return items || [];
    return items.filter(function (item) {
      return !item.store_id || item.store_id === selectedStore;
    });
  }

  /* ── Render 6 flag cards ── */
  function renderCards() {
    if (!report) return;

    var stockouts = filterStore(report.stockout_risk || []);
    var expiry    = filterStore(report.expiry_risk   || []);
    var dead      = filterStore(report.dead_stock    || []);
    var ghost     = filterStore(report.ghost_stock   || []);
    var spikes    = filterStore(report.sales_spikes  || []);
    var drops     = filterStore(report.sales_drops   || []);

    setCard(cards.stockout, stockouts,
      makeSub(stockouts, function(i){ return firstName(i) + " — " + i.days_left + "d left"; }),
      "All clear ✓");

    setCard(cards.expiry, expiry,
      makeSub(expiry, function(i){ return firstName(i) + " (" + i.days_to_expiry + "d)"; }),
      "None expiring ✓");

    setCard(cards.dead, dead,
      makeSub(dead, function(i){ return firstName(i) + " — " + i.current_stock + " units"; }),
      "All moving ✓");

    setCard(cards.ghost, ghost,
      makeSub(ghost, function(i){ return firstName(i) + " — " + i.current_stock + " units"; }),
      "None ✓");

    setCard(cards.spike, spikes,
      makeSub(spikes, function(i){ return firstName(i) + " " + i.spike_factor + "×"; }),
      "No spikes ✓");

    setCard(cards.drop, drops,
      makeSub(drops, function(i){ return firstName(i) + " ↓" + i.drop_factor + "×"; }),
      "No drops ✓");
  }

  function firstName(item) {
    return (item.product_name || "").split(" ").slice(0, 3).join(" ");
  }

  function setCard(card, items, subText, emptyText) {
    card.count.textContent = items.length;
    card.sub.textContent   = items.length ? subText : emptyText;
  }

  /* ── Detail panel ── */
  var DETAIL_LABELS = {
    stockout: "⚠ Stockout Risk — Running Low",
    expiry:   "⏳ Near Expiry — Act Before Loss",
    dead:     "📦 Dead Stock — Not Moving",
    ghost:    "👻 Ghost Stock — Zero Sales Ever",
    spike:    "📈 Sales Spike — Unusually High",
    drop:     "📉 Sales Drop — Unusually Low",
  };

  function getDetailItems(type) {
    if (!report) return [];
    switch (type) {
      case "stockout": return filterStore(report.stockout_risk || []);
      case "expiry":   return filterStore(report.expiry_risk   || []);
      case "dead":     return filterStore(report.dead_stock    || []);
      case "ghost":    return filterStore(report.ghost_stock   || []);
      case "spike":    return filterStore(report.sales_spikes  || []);
      case "drop":     return filterStore(report.sales_drops   || []);
      default:         return [];
    }
  }

  function metaText(type, item) {
    switch (type) {
      case "stockout": return item.current_stock + " units\n" + item.days_left + "d left";
      case "expiry":   return item.days_to_expiry + "d\n"    + item.current_stock + " units";
      case "dead":     return item.current_stock + " units\n0 sales/day";
      case "ghost":    return item.current_stock + " units\n0 ever";
      case "spike":    return item.spike_factor + "× spike\n" + item.prior_avg + "→" + item.recent_avg + "/d";
      case "drop":     return "↓ " + item.prior_avg + "→" + item.recent_avg + "/d";
      default:         return "";
    }
  }

  /* Build detail list — called on card click AND on store change */
  function buildDetailList(type) {
    detailTitle.textContent = DETAIL_LABELS[type] || type;
    detailList.innerHTML    = "";
    var items = getDetailItems(type);

    if (!items.length) {
      detailList.innerHTML = "<div style='padding:.4rem 0;font-size:.8rem;color:var(--ink-soft)'>No items for this selection.</div>";
      return;
    }

    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "detail-row";
      row.innerHTML =
        "<div>" +
          "<div class='detail-name'>"   + esc(item.product_name) + "</div>" +
          (item.store_name ? "<div class='detail-store'>" + esc(item.store_name) + "</div>" : "") +
          "<div class='detail-action'>" + esc(item.action || "") + "</div>" +
        "</div>" +
        "<div class='detail-meta'>" + esc(metaText(type, item)) + "</div>";
      detailList.appendChild(row);
    });
  }

  /* Card click — toggle open/close */
  function openDetail(type) {
    var isSame = activeCard === type && !detailPanel.hidden;
    Object.values(cards).forEach(function (c) { c.el.classList.remove("active"); });

    if (isSame) {
      detailPanel.hidden = true;
      activeCard = null;
      return;
    }

    activeCard = type;
    cards[type].el.classList.add("active");
    buildDetailList(type);
    detailPanel.hidden = false;
  }

  detailClose.addEventListener("click", function () {
    detailPanel.hidden = true;
    Object.values(cards).forEach(function (c) { c.el.classList.remove("active"); });
    activeCard = null;
  });

  Object.keys(cards).forEach(function (type) {
    cards[type].el.addEventListener("click",   function () { openDetail(type); });
    cards[type].el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(type); }
    });
  });

  /* ── Format facts for "Show numbers behind this" ── */
  function formatFacts(facts) {
    if (!facts || Object.keys(facts).length === 0) return "";
    var lines  = [];
    var intent = facts.intent;

    if (facts.found === false) {
      if (facts.reason === "product_not_found") {
        lines.push("❌ Product not found: " + (facts.searched_for || ""));
        if (facts.suggestions && facts.suggestions.length)
          lines.push("🔍 Did you mean: " + facts.suggestions.join(", ") + "?");
      } else {
        lines.push("ℹ️ " + (facts.reason || "Cannot answer from available data"));
        if (facts.what_i_have) lines.push("📂 Available: " + facts.what_i_have);
        if (facts.honest_message) lines.push(facts.honest_message);
      }
      return lines.join("\n");
    }

    switch (intent) {
      case "stock_level":
        lines.push("📦 Stock — " + facts.product + " @ " + facts.store);
        lines.push("• Stock: " + facts.stock_count + " units");
        if (facts.avg_daily_rate_7d != null) lines.push("• Selling rate: " + facts.avg_daily_rate_7d + " units/day (7d avg)");
        if (facts.days_left != null)         lines.push("• Days left: " + facts.days_left);
        (facts.breakdown || []).forEach(function (b) {
          lines.push("  – " + b.store + ": " + b.stock + " units (exp: " + b.expiry + ")");
        });
        break;

      case "sales_summary":
        lines.push("📊 Sales — " + facts.product + " @ " + facts.store);
        lines.push("• Period: last " + facts.period_days + " days");
        lines.push("• Total sold: " + facts.total_units_sold + " units");
        lines.push("• Avg/day: "   + facts.avg_units_per_day + " units");
        if (facts.estimated_revenue_inr) lines.push("• Est. revenue: ₹" + facts.estimated_revenue_inr);
        break;

      case "low_stock":
        lines.push("⚠ " + facts.count + " stockout risk(s) @ " + facts.store);
        (facts.items || []).slice(0, 6).forEach(function (item) {
          lines.push("• " + item.product_name + " — " + item.current_stock + " units, " + item.days_left + "d left @ " + item.store_name);
        });
        break;

      case "expiry_risk":
        lines.push("⏳ " + facts.count + " item(s) near expiry @ " + facts.store);
        (facts.items || []).slice(0, 6).forEach(function (item) {
          lines.push("• " + item.product_name + " — " + item.days_to_expiry + "d, " + item.current_stock + " units @ " + item.store_name);
        });
        break;

      case "dead_stock":
        lines.push("📦 " + facts.count + " dead stock item(s)");
        lines.push("Criteria: " + facts.criteria);
        (facts.items || []).slice(0, 6).forEach(function (item) {
          lines.push("• " + item.product_name + " @ " + (item.store_name || "all stores") + " — " + item.current_stock + " units, " + item.daily_rate + " units/day");
        });
        break;

      case "ghost_stock":
        lines.push("👻 " + facts.count + " ghost stock item(s)");
        lines.push("Criteria: " + facts.criteria);
        (facts.items || []).slice(0, 6).forEach(function (item) {
          lines.push("• " + item.product_name + " @ " + (item.store_name || "all stores") + " — " + item.current_stock + " units, 0 sales ever");
        });
        break;

      case "sales_spike_drop":
        (facts.spikes || []).forEach(function (s) {
          lines.push("📈 Spike: " + s.product_name + " @ " + (s.store_name || "all") + " — " + s.spike_factor + "× (" + s.prior_avg + "→" + s.recent_avg + " units/day)");
        });
        (facts.drops || []).forEach(function (d) {
          lines.push("📉 Drop: " + d.product_name + " @ " + (d.store_name || "all") + " — " + d.prior_avg + "→" + d.recent_avg + " units/day");
        });
        break;

      case "store_comparison":
        lines.push("🏪 Performance last " + facts.period_days + " days:");
        (facts.ranked_stores || []).forEach(function (s, i) {
          var tag = i === 0 ? "🔴 Lowest" : (i === facts.ranked_stores.length - 1 ? "🟢 Highest" : "🟡");
          lines.push(tag + " " + s.store_name + " — " + s.total_units_sold + " units | ₹" + s.estimated_revenue_inr);
        });
        break;

      case "attention_summary":
        var sm = facts.summary || {};
        lines.push("📋 Today at a glance:");
        lines.push("• Stockout risks: " + (sm.stockout_count    || 0));
        lines.push("• Near expiry:    " + (sm.expiry_count      || 0));
        lines.push("• Dead stock:     " + (sm.dead_stock_count  || 0));
        lines.push("• Ghost stock:    " + (sm.ghost_stock_count || 0));
        lines.push("• Sales spikes:   " + (sm.spike_count       || 0));
        lines.push("• Sales drops:    " + (sm.drop_count        || 0));
        break;

      default:
        if (facts.honest_message) lines.push("ℹ️ " + facts.honest_message);
    }
    return lines.join("\n");
  }

  /* ── Chat — POST /api/chat {question, store_id?} ── */
  function scrollChat() { chatLog.scrollTop = chatLog.scrollHeight; }

  function addUserMsg(text) {
    if (chatEmpty && chatEmpty.parentNode === chatLog) chatEmpty.remove();
    var el = document.createElement("div");
    el.className = "msg user";
    el.textContent = text;
    chatLog.appendChild(el);
    scrollChat();
  }

  function addPending() {
    var el = document.createElement("div");
    el.className   = "msg assistant pending";
    el.textContent = "Thinking…";
    chatLog.appendChild(el);
    scrollChat();
    return el;
  }

  function resolveMsg(el, answer, facts) {
    el.classList.remove("pending");
    el.textContent = "";

    var txt = document.createElement("div");
    txt.textContent = answer;
    el.appendChild(txt);

    var summary = formatFacts(facts);
    if (summary) {
      var det  = document.createElement("details");
      det.className = "evidence";
      var sum  = document.createElement("summary");
      sum.textContent = "Show numbers behind this";
      det.appendChild(sum);
      var body = document.createElement("div");
      body.className   = "evidence-body";
      body.textContent = summary;
      det.appendChild(body);
      el.appendChild(det);
    }
    scrollChat();
  }

  function errorMsg(el, text) {
    el.classList.remove("pending");
    el.classList.add("is-error");
    el.textContent = text || "Something went wrong. Try again.";
    scrollChat();
  }

  chatForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var question = chatInput.value.trim();
    if (!question) return;

    chatInput.value    = "";
    chatInput.disabled = true;
    chatSend.disabled  = true;

    addUserMsg(question);
    var pending = addPending();

    try {
      var body = { question: question };
      if (selectedStore !== "all") body.store_id = selectedStore;   // store context

      var res  = await fetch("/api/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(body),
      });
      var data = await res.json();

      if (data.answer) {
        resolveMsg(pending, data.answer, data.facts);
      } else {
        errorMsg(pending, "I don't have data to answer that.");
      }
    } catch (_) {
      errorMsg(pending, "Could not reach the server. Is the backend running?");
    } finally {
      chatInput.disabled = false;
      chatSend.disabled  = false;
      chatInput.focus();
    }
  });

  /* ── Init ── */
  async function init() {
    await loadStores();     // GET /api/data/stores
    await loadAttention();  // GET /api/attention
  }

  init();
})();
</script>
